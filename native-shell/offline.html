<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vegan Eyes</title>
<style>
  :root { color-scheme: light; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #FFF7E8; color: #20251F; text-align: center;
    font-family: -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif;
    padding: 24px env(safe-area-inset-right) 24px env(safe-area-inset-left);
  }
  main { max-width: 340px; padding: 0 20px; }
  img { width: 96px; height: 96px; border-radius: 22px; }
  h1 { color: #214E34; font-size: 28px; margin: 20px 0 8px; }
  p { font-size: 16px; line-height: 1.5; margin: 0 0 24px; }
  button {
    min-height: 48px; padding: 0 28px; font: inherit; font-weight: 700; font-size: 16px;
    color: #FFF7E8; background: #214E34; border: 2px solid #20251F; border-radius: 12px;
    box-shadow: 2px 2px 0 #20251F;
  }
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="">
  <h1>You're offline</h1>
  <p>Vegan Eyes needs the internet to check ingredients. Connect to Wi-Fi or mobile data and try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
